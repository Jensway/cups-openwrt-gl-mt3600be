name: Build CUPS 2.4.16 for GL-MT3600BE

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk \
              unzip file wget python3 python3-distutils rsync zlib1g-dev \
              libelf-dev libssl-dev

      - name: Download OpenWrt 21.02 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/21.02.7/targets/mediatek/mt7622/openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64.tar.xz"
          SDK_DIR="openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64"
          mkdir -p $HOME/sdk
          cd $HOME/sdk
          wget -q "$SDK_URL"
          tar xf "${SDK_DIR}.tar.xz"
          mv "$SDK_DIR" openwrt-sdk

      - name: Prepare feeds (use packages feed but remove old libcups)
        run: |
          cd $HOME/sdk/openwrt-sdk
          # Update default feeds (packages, luci, routing, telephony)
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p packages
          
          # IMPORTANT: Remove packages feed's old libcups to avoid version conflict
          # Our feeds/cups/cups (to be copied later) provides libcups 2.4.16
          rm -rf feeds/packages/libs/libcups
          rm -rf feeds/packages/libs/libcupsimage
          
          # Install base packages needed for build
          ./scripts/feeds install -a -p luci

      - name: Pre-download CUPS 2.4.16 source and compute hash
        run: |
          cd $HOME/sdk/openwrt-sdk
          mkdir -p dl
          wget -q -O dl/cups-2.4.16-source.tar.gz \
            "https://github.com/OpenPrinting/cups/releases/download/v2.4.16/cups-2.4.16-source.tar.gz"
          HASH=$(sha256sum dl/cups-2.4.16-source.tar.gz | awk '{print $1}')
          echo "SHA256: $HASH"
          echo "CUPS_HASH=$HASH" >> $GITHUB_ENV

          # Check what directory the tarball extracts to
          echo "=== Tarball top-level directory ==="
          tar tzf dl/cups-2.4.16-source.tar.gz | head -5

      - name: Create CUPS feed directory structure
        run: |
          cd $HOME/sdk/openwrt-sdk
          mkdir -p feeds/cups/cups/files/etc/cups

      - name: Copy config files and Makefile
        run: |
          cd $HOME/sdk/openwrt-sdk
          mkdir -p feeds/cups/cups/files/etc/cups
          cp $GITHUB_WORKSPACE/openwrt-cups-overlay/cups/files/cupsd.init feeds/cups/cups/files/
          cp $GITHUB_WORKSPACE/openwrt-cups-overlay/cups/files/etc/cups/cupsd.conf feeds/cups/cups/files/etc/cups/
          
          # Copy the pre-modified Makefile
          cp $GITHUB_WORKSPACE/openwrt-cups-overlay/cups/Makefile feeds/cups/cups/Makefile
          
          # CRITICAL: Convert leading spaces (4 spaces) to tabs in all define blocks
          # This is required for OpenWrt Makefiles - make requires tabs, not spaces
          # Run multiple times to handle any number of leading spaces
          for i in 1 2 3 4 5; do sed -i 's/^ /\t/g' feeds/cups/cups/Makefile; done
          
          # DEBUG: Verify the actual characters around line 292
          echo "=== DEBUG: Line 292 content ==="
          sed -n '290,295p' feeds/cups/cups/Makefile | cat -A
          
          # VERIFY: Show our key changes in the copied Makefile
          echo "=== VERIFY: Key Makefile sections ==="
          echo "--- Build/Configure (should have --libdir=/usr/lib --enable-shared) ---"
          grep -A 5 "define Build/Configure" feeds/cups/cups/Makefile | head -10
          echo "--- Package/libcups/install (should have fallback logic) ---"
          grep -A 5 "define Package/libcups/install" feeds/cups/cups/Makefile | head -10
          
          cp -r $GITHUB_WORKSPACE/luci-app-cups package/
          # IMPORTANT: Do NOT run feeds install again here.
          # It can overwrite feeds/cups/cups/Makefile and undo our overlay copy.

      - name: Configure and enable CUPS
        run: |
          cd $HOME/sdk/openwrt-sdk
          make defconfig

          # Verify Makefile was copied correctly
          echo "=== CUPS Makefile configure section ==="
          grep -A 30 "define Build/Configure" feeds/cups/cups/Makefile | head -35

          echo "CONFIG_PACKAGE_cups=m" >> .config
          echo "CONFIG_PACKAGE_libcups=m" >> .config
          echo "CONFIG_PACKAGE_libcupsimage=m" >> .config
          echo "CONFIG_PACKAGE_cups-bsd=m" >> .config
          echo "CONFIG_PACKAGE_cups-client=m" >> .config
          echo "CONFIG_PACKAGE_cups-filters=m" >> .config
          echo "CONFIG_PACKAGE_cups-ppdc=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-cups=m" >> .config

          make defconfig
          echo "=== CUPS config entries ==="
          grep -i 'cups' .config || true

      - name: Build CUPS package (first attempt - check install layout)
        run: |
          cd $HOME/sdk/openwrt-sdk
          
          # CRITICAL: Clean up old build artifacts to ensure our Makefile is used
          echo "=== Cleaning old build artifacts ==="
          rm -rf build_dir/target-aarch64_cortex-a53_musl/cups-2.4.16
          rm -f bin/packages/*/cups_* 2>/dev/null || true
          
          # Double-check: Verify our Makefile is in place BEFORE building
          echo "=== VERIFY: Makefile just before build ==="
          echo "--- Package/libcups/install section ---"
          grep -A 3 "define Package/libcups/install" feeds/cups/cups/Makefile
          
          # Check configure generated
          BDIR="build_dir/target-aarch64_cortex-a53_musl/cups-2.4.16"
          if [ -f "$BDIR/Makefile" ]; then
            echo "=== CUPS generated Makefile config ==="
            grep "enable-shared\|disable-static\|libdir" "$BDIR/Makefile" | head -10 || true
            echo "=== CUPS config.log summary ==="
            grep -i "shared\|static\|libdir" "$BDIR/config.log" | head -20 || true
          else
            echo "No Makefile yet in BDIR"
          fi

          # First run make but allow failure so we can inspect
          make feeds/cups/cups/compile V=s -j1 2>&1 | tee /tmp/cups-build.log || true

          # Check what got installed and where
          BDIR="build_dir/target-aarch64_cortex-a53_musl/cups-2.4.16"
          echo "=== Build log (last 50 lines) ==="
          tail -50 /tmp/cups-build.log 2>/dev/null || echo "no log"
          echo "=== Check if BDIR exists ==="
          ls -la "$BDIR" 2>/dev/null || echo "BDIR does NOT exist"
          echo "=== Check if ipkg-install exists ==="
          ls -la "$BDIR/ipkg-install" 2>/dev/null || echo "ipkg-install does NOT exist"
          echo "=== ipkg-install tree ==="
          find "$BDIR/ipkg-install" -type f 2>/dev/null | head -50 || echo "no ipkg-install"
          echo "=== Looking for libcups.so ==="
          find "$BDIR" -name 'libcups.so*' 2>/dev/null
          echo "=== Looking for libcups in lib64 ==="
          find "$BDIR" -path '*/lib64/*' -name 'libcups.so*' 2>/dev/null
          echo "=== Looking for cupsd ==="
          find "$BDIR" -name 'cupsd' -type f 2>/dev/null
          echo "=== Full DSTROOT layout ==="
          find "$BDIR/ipkg-install" -type f 2>/dev/null || echo "empty"
          echo "=== List ALL directories in ipkg-install ==="
          find "$BDIR/ipkg-install" -type d 2>/dev/null | head -30
          echo "=== Look for ALL .so files anywhere in build dir ==="
          find "$BDIR" -name '*.so*' -type f 2>/dev/null | head -20

      - name: Fix install paths and rebuild if needed
        run: |
          cd $HOME/sdk/openwrt-sdk
          BDIR="build_dir/target-aarch64_cortex-a53_musl/cups-2.4.16"
          INST="$BDIR/ipkg-install"

          echo "=== DEBUG: Checking ipkg-install directory ==="
          ls -la "$INST" 2>/dev/null || echo "ERROR: $INST does not exist"
          echo "=== DEBUG: Checking for /usr/lib ==="
          ls -la "$INST/usr/lib" 2>/dev/null || echo "ERROR: $INST/usr/lib does not exist"
          echo "=== DEBUG: Checking for /usr/lib64 ==="
          ls -la "$INST/usr/lib64" 2>/dev/null || echo "ERROR: $INST/usr/lib64 does not exist"

          # If libs ended up in /usr/lib64, symlink them to /usr/lib
          if [ -d "$INST/usr/lib64" ] && [ ! -d "$INST/usr/lib" ]; then
            echo "Fixing: moving lib64 to lib"
            mv "$INST/usr/lib64" "$INST/usr/lib"
          elif [ -d "$INST/usr/lib64" ] && [ -d "$INST/usr/lib" ]; then
            echo "Fixing: merging lib64 into lib"
            cp -a "$INST/usr/lib64/"* "$INST/usr/lib/"
            rm -rf "$INST/usr/lib64"
          fi

          # If libs ended up in /usr/local/lib, fix that too
          if [ -d "$INST/usr/local/lib" ]; then
            echo "Fixing: moving /usr/local/lib to /usr/lib"
            mkdir -p "$INST/usr/lib"
            cp -a "$INST/usr/local/lib/"* "$INST/usr/lib/"
          fi
          if [ -d "$INST/usr/local" ]; then
            echo "Fixing: merging /usr/local into /usr"
            cp -a "$INST/usr/local/bin/"* "$INST/usr/bin/" 2>/dev/null || true
            cp -a "$INST/usr/local/sbin/"* "$INST/usr/sbin/" 2>/dev/null || true
            cp -a "$INST/usr/local/include/"* "$INST/usr/include/" 2>/dev/null || true
            cp -a "$INST/usr/local/share/"* "$INST/usr/share/" 2>/dev/null || true
          fi

          # Fallback: if libcups still not in usr/lib, find and copy from anywhere in build
          if ! ls "$INST/usr/lib/libcups.so"* 1>/dev/null 2>&1; then
            echo "Fallback: searching for libcups.so in build tree"
            mkdir -p "$INST/usr/lib"
            find "$BDIR" -name 'libcups.so*' -type f -exec cp -fp {} "$INST/usr/lib/" \;
          fi

          echo "=== Fixed install layout ==="
          find "$INST" -name 'libcups*' 2>/dev/null
          find "$INST" -name 'cupsd' 2>/dev/null

          # Now re-run the packaging step (do NOT remove .built_check or it will rebuild and overwrite our fix)
          rm -f "$BDIR/.pkgdir/"*stamp* 2>/dev/null || true

          make package/cups/compile V=s -j1

      - name: Build luci-app-cups
        run: |
          cd $HOME/sdk/openwrt-sdk
          make package/luci-app-cups/compile V=s -j1

      - name: Collect all CUPS related IPKs
        run: |
          mkdir -p $HOME/cups-ipk-output
          find $HOME/sdk/openwrt-sdk/bin -name '*.ipk' -exec cp {} $HOME/cups-ipk-output/ \;
          echo "=== Generated IPK files ==="
          ls -la $HOME/cups-ipk-output/

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cups-2.4.16-ipk
          path: ~/cups-ipk-output/*.ipk
          if-no-files-found: error
