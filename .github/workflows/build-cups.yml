name: Build CUPS 2.4.16 for GL-MT3600BE

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk \
              unzip file wget python3 python3-distutils rsync zlib1g-dev \
              libelf-dev libssl-dev

      - name: Download OpenWrt 21.02 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/21.02.7/targets/mediatek/mt7622/openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64.tar.xz"
          SDK_DIR="openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64"
          mkdir -p $HOME/sdk
          cd $HOME/sdk
          wget -q "$SDK_URL"
          tar xf "${SDK_DIR}.tar.xz"
          mv "$SDK_DIR" openwrt-sdk

      - name: Prepare feeds and install CUPS feed
        run: |
          cd $HOME/sdk/openwrt-sdk
          echo "src-git cups https://github.com/TheMMcOfficial/lede-cups.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pre-download CUPS 2.4.16 source and compute hash
        run: |
          cd $HOME/sdk/openwrt-sdk
          mkdir -p dl
          wget -q -O dl/cups-2.4.16-source.tar.gz \
            "https://github.com/OpenPrinting/cups/releases/download/v2.4.16/cups-2.4.16-source.tar.gz"
          HASH=$(sha256sum dl/cups-2.4.16-source.tar.gz | awk '{print $1}')
          echo "SHA256: $HASH"
          echo "CUPS_HASH=$HASH" >> $GITHUB_ENV

          # Check what directory the tarball extracts to
          echo "=== Tarball top-level directory ==="
          tar tzf dl/cups-2.4.16-source.tar.gz | head -5

      - name: Patch CUPS feed Makefile from 2.3.0 to 2.4.16
        run: |
          cd $HOME/sdk/openwrt-sdk
          MF=feeds/cups/cups/Makefile

          echo "=== Before patch ==="
          head -15 "$MF"

          # Change version
          sed -i 's/^PKG_VERSION:=2.3.0$/PKG_VERSION:=2.4.16/' "$MF"
          sed -i 's/^PKG_RELEASE:=2$/PKG_RELEASE:=1/' "$MF"

          # Change source URL from Apple to OpenPrinting
          sed -i 's|PKG_SOURCE_URL:=https://github.com/apple/cups/releases/download/v$(PKG_VERSION)|PKG_SOURCE_URL:=https://github.com/OpenPrinting/cups/releases/download/v$(PKG_VERSION)|' "$MF"

          # Replace MD5 with proper SHA256 hash
          sed -i "s/^PKG_MD5SUM:=.*/PKG_HASH:=${{ env.CUPS_HASH }}/" "$MF"

          # Fix configure: replace old SSL flags with --with-tls=no
          sed -i 's/--disable-gnutls \\$/--with-tls=no \\/' "$MF"
          sed -i '/--disable-openssl \\/d' "$MF"
          sed -i '/--disable-cdsassl \\/d' "$MF"
          sed -i '/--disable-ssl \\/d' "$MF"

          echo "=== After patch ==="
          head -20 "$MF"
          echo "..."
          grep -n 'tls\|ssl\|SSL\|VERSION\|SOURCE_URL\|HASH\|MD5\|BUILD_DIR' "$MF" || true

          # Verify tabs
          echo "=== Tab check ==="
          cat -A "$MF" | grep -c "^I" || echo "WARNING: no tab-indented lines found"

          # Remove old patches (written for 2.3.0, incompatible with 2.4.16)
          echo "=== Removing old patches ==="
          ls feeds/cups/cups/patches/ 2>/dev/null || echo "no patches dir"
          rm -rf feeds/cups/cups/patches
          echo "Old patches removed."

          echo "=== Final Makefile ==="
          cat "$MF"

      - name: Copy config files
        run: |
          cd $HOME/sdk/openwrt-sdk
          mkdir -p feeds/cups/cups/files/etc/cups
          cp $GITHUB_WORKSPACE/openwrt-cups-overlay/cups/files/cupsd.init feeds/cups/cups/files/
          cp $GITHUB_WORKSPACE/openwrt-cups-overlay/cups/files/etc/cups/cupsd.conf feeds/cups/cups/files/etc/cups/

          # Re-install feeds
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Configure and enable CUPS
        run: |
          cd $HOME/sdk/openwrt-sdk
          make defconfig

          echo "CONFIG_PACKAGE_cups=m" >> .config
          echo "CONFIG_PACKAGE_libcups=m" >> .config
          echo "CONFIG_PACKAGE_libcupsimage=m" >> .config
          echo "CONFIG_PACKAGE_cups-bsd=m" >> .config
          echo "CONFIG_PACKAGE_cups-client=m" >> .config
          echo "CONFIG_PACKAGE_cups-filters=m" >> .config
          echo "CONFIG_PACKAGE_cups-ppdc=m" >> .config

          make defconfig
          echo "=== CUPS config entries ==="
          grep -i 'cups' .config || true

      - name: Build CUPS package (first attempt - check install layout)
        run: |
          cd $HOME/sdk/openwrt-sdk
          # First run make but allow failure so we can inspect
          make package/cups/compile V=s -j1 || true

          # Check what got installed and where
          BDIR="build_dir/target-aarch64_cortex-a53_musl/cups-2.4.16"
          echo "=== ipkg-install tree ==="
          find "$BDIR/ipkg-install" -type f 2>/dev/null | head -50 || echo "no ipkg-install"
          echo "=== Looking for libcups.so ==="
          find "$BDIR" -name 'libcups.so*' 2>/dev/null
          echo "=== Looking for cupsd ==="
          find "$BDIR" -name 'cupsd' -type f 2>/dev/null
          echo "=== Full DSTROOT layout ==="
          find "$BDIR/ipkg-install" -type f 2>/dev/null || echo "empty"

      - name: Fix install paths and rebuild if needed
        run: |
          cd $HOME/sdk/openwrt-sdk
          BDIR="build_dir/target-aarch64_cortex-a53_musl/cups-2.4.16"
          INST="$BDIR/ipkg-install"

          # If libs ended up in /usr/lib64, symlink them to /usr/lib
          if [ -d "$INST/usr/lib64" ] && [ ! -d "$INST/usr/lib" ]; then
            echo "Fixing: moving lib64 to lib"
            mv "$INST/usr/lib64" "$INST/usr/lib"
          elif [ -d "$INST/usr/lib64" ] && [ -d "$INST/usr/lib" ]; then
            echo "Fixing: merging lib64 into lib"
            cp -a "$INST/usr/lib64/"* "$INST/usr/lib/"
            rm -rf "$INST/usr/lib64"
          fi

          # If libs ended up in /usr/local/lib, fix that too
          if [ -d "$INST/usr/local/lib" ]; then
            echo "Fixing: moving /usr/local/lib to /usr/lib"
            mkdir -p "$INST/usr/lib"
            cp -a "$INST/usr/local/lib/"* "$INST/usr/lib/"
          fi
          if [ -d "$INST/usr/local" ]; then
            echo "Fixing: merging /usr/local into /usr"
            cp -a "$INST/usr/local/bin/"* "$INST/usr/bin/" 2>/dev/null || true
            cp -a "$INST/usr/local/sbin/"* "$INST/usr/sbin/" 2>/dev/null || true
            cp -a "$INST/usr/local/include/"* "$INST/usr/include/" 2>/dev/null || true
            cp -a "$INST/usr/local/share/"* "$INST/usr/share/" 2>/dev/null || true
          fi

          echo "=== Fixed install layout ==="
          find "$INST" -name 'libcups*' 2>/dev/null
          find "$INST" -name 'cupsd' 2>/dev/null

          # Now re-run the packaging step
          # Remove stamp files to force re-packaging
          rm -f "$BDIR/.pkgdir/"*stamp* 2>/dev/null || true
          rm -f "$BDIR/.built_check" 2>/dev/null || true

          make package/cups/compile V=s -j1

      - name: Collect all CUPS related IPKs
        run: |
          mkdir -p $HOME/cups-ipk-output
          find $HOME/sdk/openwrt-sdk/bin -name '*.ipk' -exec cp {} $HOME/cups-ipk-output/ \;
          echo "=== Generated IPK files ==="
          ls -la $HOME/cups-ipk-output/

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cups-2.4.16-ipk
          path: ~/cups-ipk-output/*.ipk
          if-no-files-found: error
