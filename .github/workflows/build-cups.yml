name: Build CUPS for GL-MT3600BE

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk \
              unzip file wget python3 python3-distutils rsync zlib1g-dev \
              libelf-dev ecj fastjar java-propose-classpath

      - name: Download OpenWrt 21.02 aarch64_cortex-a53 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/21.02.7/targets/mediatek/mt7622/openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64.tar.xz"
          SDK_DIR="openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64"
          mkdir -p $HOME/sdk
          cd $HOME/sdk
          wget -q "$SDK_URL"
          tar xf "${SDK_DIR}.tar.xz"
          mv "$SDK_DIR" openwrt-sdk

      - name: Prepare feeds and install CUPS
        run: |
          cd $HOME/sdk/openwrt-sdk

          # Use the cups feed that is known to work with OpenWrt 21.02
          echo "src-git cups https://github.com/TheMMcOfficial/lede-cups.git" >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Verify cups package is found
          find . -path '*/cups/Makefile' | head -20
          ls -la feeds/cups/ 2>/dev/null || true
          ls -la package/feeds/cups/ 2>/dev/null || true

      - name: Configure and enable CUPS
        run: |
          cd $HOME/sdk/openwrt-sdk

          # Generate default config
          make defconfig

          # Enable cups and all its libs as modules
          sed -i 's/# CONFIG_PACKAGE_cups is not set/CONFIG_PACKAGE_cups=m/' .config 2>/dev/null || true
          echo "CONFIG_PACKAGE_cups=m" >> .config
          echo "CONFIG_PACKAGE_libcups=m" >> .config
          echo "CONFIG_PACKAGE_libcupscgi=m" >> .config
          echo "CONFIG_PACKAGE_libcupsmime=m" >> .config
          echo "CONFIG_PACKAGE_libcupsppdc=m" >> .config

          make defconfig

          # Verify cups is selected
          grep -i cups .config || true

      - name: Build CUPS package
        run: |
          cd $HOME/sdk/openwrt-sdk

          # Build with verbose output to see errors
          make package/cups/compile V=s -j1 || \
          make package/feeds/cups/cups/compile V=s -j1 || \
          echo "Trying alternative make target..." && \
          make V=s -j1

      - name: Collect all CUPS related IPKs
        run: |
          mkdir -p $HOME/cups-ipk-output
          find $HOME/sdk/openwrt-sdk/bin -name '*.ipk' -exec cp {} $HOME/cups-ipk-output/ \;
          echo "=== Generated IPK files ==="
          ls -la $HOME/cups-ipk-output/

      - name: Upload IPK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cups-ipk
          path: ~/cups-ipk-output/*.ipk
          if-no-files-found: error
